<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6" crossorigin="anonymous">

    <title>Take Attendance | Face Recognition Based Attendance System</title>

    <style type="text/css">
        * { padding: 0; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-image: url('https://cutewallpaper.org/21/1920-x-1080-gif/1920x1080-Wallpapercartoon-Wallpapers-Driverlayer-Search-.gif');
            background-size: cover;
            min-height: 100vh;
            padding-bottom: 30px;
        }
        .camera-box { position: relative; max-width: 640px; margin: 0 auto; background: #000; border-radius: 12px; overflow: hidden; }
        #video { display: block; width: 100%; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #status { max-width: 640px; margin: 12px auto; padding: 8px 12px; border-radius: 8px; color: #fff; font-size: 18px; background: rgba(0, 0, 0, .55); }
        .panel { max-width: 640px; margin: 16px auto 0; padding: 12px; border-radius: 12px; background: rgba(255, 255, 255, .9); }
    </style>
</head>

<body>
    <div class="mt-3 text-center">
        <h1 style="color: white; padding: 11px; font-size: 36px;">Take Attendance</h1>
        <a href="/" style="color: white; font-size: 18px;">&larr; Back to home</a>
    </div>

    <p id="status" class="text-center">Starting camera&hellip;</p>

    <div class="camera-box">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
    </div>
    <canvas id="grab" hidden></canvas>

    <div class="text-center mt-3">
        <button id="toggle" type="button" class="btn btn-danger btn-lg">Stop</button>
    </div>

    <div class="panel">
        <h5>Marked this session</h5>
        <ul id="marked" style="padding-left: 22px;"></ul>
    </div>

    <script src="{{ url_for('static', filename='camera.js') }}"></script>
    <script>
        (function () {
            "use strict";
            var SESSION_SECONDS = {{ session_seconds }};
            var INTERVAL_MS = 300;
            var CONFIRM_FRAMES = {{ confirm_frames }};

            var video = document.getElementById("video");
            var overlay = document.getElementById("overlay");
            var grab = document.getElementById("grab");
            var statusEl = document.getElementById("status");
            var toggle = document.getElementById("toggle");
            var markedList = document.getElementById("marked");
            var running = false;
            var runId = 0;

            function setStatus(text, isError) {
                statusEl.textContent = text;
                statusEl.style.background = isError ? "rgba(180, 0, 0, .8)" : "rgba(0, 0, 0, .55)";
            }

            function addMarked(text) {
                var li = document.createElement("li");
                li.textContent = text;
                markedList.appendChild(li);
            }

            function show(res, frame) {
                var label = "", color = "#ffcc00";
                switch (res.status) {
                    case "unknown":
                        label = "Unknown"; color = "#ff3b30";
                        setStatus("Unknown face.");
                        break;
                    case "confirming":
                        label = res.name; color = "#ffcc00";
                        setStatus("Recognising " + res.name + " (" + res.progress + "/" + res.needed + ")");
                        break;
                    case "marked":
                        label = res.name; color = "#34c759";
                        setStatus("Attendance marked: " + res.name);
                        addMarked(res.name + " at " + new Date().toLocaleTimeString());
                        break;
                    case "already":
                        label = res.name; color = "#34c759";
                        setStatus(res.name + " was already marked today.");
                        break;
                    case "done":
                        label = res.name; color = "#34c759";
                        setStatus("Attendance recorded: " + res.name);
                        break;
                    default:
                        setStatus("No face detected. Face the camera.");
                }
                Cam.drawFace(overlay, frame, res.face, label, color);
            }

            async function run() {
                var myRun = ++runId;
                var stream = null, failures = 0, message = null, isError = false;
                toggle.textContent = "Stop";
                setStatus("Starting camera\u2026");
                try {
                    stream = await Cam.startCamera(video);
                } catch (e) {
                    setStatus(Cam.describeError(e), true);
                    toggle.textContent = "Try again";
                    return;
                }
                running = true;
                setStatus("Look at the camera.");
                var started = Date.now();
                while (running && myRun === runId) {
                    if (Date.now() - started > SESSION_SECONDS * 1000) {
                        message = "Session time limit reached.";
                        break;
                    }
                    var t0 = Date.now();
                    try {
                        var frame = await Cam.grabFrame(video, grab);
                        var res = await Cam.postFrame("/api/recognize", { token: token }, frame.blob);
                        failures = 0;
                        if (running && myRun === runId) { show(res, frame); }
                    } catch (e) {
                        failures += 1;
                        if (failures >= 5) {
                            message = "Connection problem: " + e.message;
                            isError = true;
                            break;
                        }
                    }
                    var wait = INTERVAL_MS - (Date.now() - t0);
                    if (wait > 0) { await Cam.sleep(wait); }
                }
                if (myRun !== runId) { return; }
                running = false;
                Cam.stopCamera(stream, video);
                overlay.getContext("2d").clearRect(0, 0, overlay.width, overlay.height);
                if (message) { setStatus(message, isError); }
                else { setStatus("Stopped."); }
                toggle.textContent = "Start again";
            }

            var token = Cam.token();
            toggle.addEventListener("click", function () {
                if (running) { running = false; }
                else { token = Cam.token(); run(); }
            });

            run();
        })();
    </script>
</body>

</html>
